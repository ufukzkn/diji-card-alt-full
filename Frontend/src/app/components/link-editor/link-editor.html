<!-- mode butonları -->
<div class="mode-buttons" *ngIf="canEdit">
  <button class="mode-btn" (click)="toggleMode('add')" [class.active]="mode==='add'">
    ➕ {{ 'linkEditor.mode.add' | transloco }}
  </button>
  <button class="mode-btn" (click)="toggleMode('delete')" [class.active]="mode==='delete'">
    ➖ {{ 'linkEditor.mode.delete' | transloco }}
  </button>
  <button class="mode-btn" (click)="toggleMode('edit')" [class.active]="mode==='edit'">
    ✏️ {{ 'linkEditor.mode.edit' | transloco }}
  </button>
  <button class="mode-btn" (click)="toggleMode('sort')" [class.active]="mode==='sort'">
    ⇅ {{ 'linkEditor.mode.sort' | transloco }}
  </button>
</div>

<!-- + MOD: yeni tanım / link ekle -->
<div *ngIf="mode==='add' && canEdit" class="mode-panel">
  <select [(ngModel)]="selectedDefinitionId">
    <option value="" disabled>{{ 'linkEditor.add.selectDefinition' | transloco }}</option>
    <option *ngFor="let d of availableDefinitions()" [value]="d.definitionId">
      {{ d.definitionName }}
    </option>
    <option value="__new">{{ 'linkEditor.add.optionNew' | transloco }}</option>
    <option value="__custom">{{ 'linkEditor.add.optionCustom' | transloco }}</option>
  </select>

  <input *ngIf="selectedDefinitionId==='__new'"
         [(ngModel)]="newDefinitionName"
         [placeholder]="'linkEditor.add.placeholder.newDefinitionName' | transloco" />

  <!-- Kişisel tanım alanları -->
  <div *ngIf="selectedDefinitionId==='__custom'" class="custom-fields">
    <input [(ngModel)]="customDefinitionName" [placeholder]="'linkEditor.add.placeholder.customDefinitionName' | transloco" />
  </div>

  <input [(ngModel)]="value" [placeholder]="'linkEditor.add.placeholder.value' | transloco" />

  <button class="action-btn" 
          [disabled]="!canAddLink()"
          (click)="add()">➕ {{ 'linkEditor.add.actionAdd' | transloco }}</button>
</div>

<!-- CUSTOM MOD kaldırıldı çünkü dropdown'a entegre edildi -->

<!-- – MOD: var olan linkleri sil -->
<div *ngIf="mode==='delete' && canEdit" class="mode-panel">
  <select [(ngModel)]="selectedToDelete">
    <option value="" disabled selected>{{ 'linkEditor.delete.selectDefinition' | transloco }}</option>
    <option *ngFor="let l of userLinks" [ngValue]="l.id">
      {{ l.displayName }}
    </option>
    <option [ngValue]="'__delete'">{{ 'linkEditor.delete.optionDeleteDefinition' | transloco }}</option>
  </select>

  <input *ngIf="selectedToDelete === '__delete'"
         [(ngModel)]="deleteDefinitionName"
         [placeholder]="'linkEditor.delete.placeholder.definitionName' | transloco" />

  <ng-container *ngIf="selectedToDelete === '__delete'">
    <button class="action-btn delete-btn" 
            [disabled]="!deleteDefinitionName"
            (click)="deleteDefinition()">
      ➖ {{ 'linkEditor.delete.actionDeleteDefinition' | transloco }}
    </button>
  </ng-container>

  <ng-container *ngIf="selectedToDelete !== '__delete'">
    <button class="action-btn delete-btn" 
            [disabled]="!selectedToDelete && selectedToDelete !== 0"
            (click)="onDeleteClick()">
      ➖ {{ 'linkEditor.delete.actionDelete' | transloco }}
    </button>
  </ng-container>
</div>

<!-- EDIT MODE: mevcut tanımı seçip değerini güncelle -->
<div *ngIf="mode==='edit' && canEdit" class="mode-panel">
  <select [(ngModel)]="selectedToEdit">
    <option value="" disabled selected>{{ 'linkEditor.edit.selectDefinition' | transloco }}</option>
    <option *ngFor="let l of userLinks" [value]="l.id">
      {{ l.displayName }} (ID: {{l.id}})
    </option>
  </select>
  <input *ngIf="selectedToEdit" [(ngModel)]="editValue" [placeholder]="'linkEditor.edit.placeholder.newValue' | transloco" />
  <button class="action-btn edit-btn" [disabled]="!selectedToEdit || !editValue" (click)="edit()">✏️ {{ 'linkEditor.edit.actionSave' | transloco }}</button>
</div>

<!-- Sıralama Modu -->
<div *ngIf="mode==='sort' && canEdit" class="mode-panel">
  <div cdkDropList class="example-list-vertical" (cdkDropListDropped)="drop($event)">
    <div *ngFor="let link of userLinksArray" cdkDrag class="example-box-vertical">
      {{ link.displayName }}
    </div>
  </div>
  <button class="save-sort-btn" (click)="saveSortOrder()">{{ 'linkEditor.sort.actionSaveOrder' | transloco }}</button>
</div>
