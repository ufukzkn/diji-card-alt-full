<div class="login-container">
  <div class="login-card">
    <div class="brand-header">
      <h1 class="brand-title">Digital Business Card</h1>
      <p class="brand-subtitle">Dijital kartvizit platformu</p>
    </div>
    <h2>Giriş Yap</h2>
    
    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="kullaniciAdi">Kullanıcı Adı / E-posta:</label>
        <input 
          type="email" 
          id="kullaniciAdi" 
          name="kullaniciAdi"
          [(ngModel)]="loginData.kullaniciAdi" 
          required 
          class="form-control"
          placeholder="ornek@email.com">
      </div>

      <div class="form-group">
        <label for="sifre">Şifre:</label>
        <input 
          type="password" 
          id="sifre" 
          name="sifre"
          [(ngModel)]="loginData.sifre" 
          required 
          class="form-control"
          placeholder="Şifrenizi girin">
      </div>

      <button 
        type="submit" 
        [disabled]="!loginForm.form.valid || isLoading"
        class="btn btn-primary btn-block">
        {{ isLoading ? 'Giriş yapılıyor...' : 'Giriş Yap' }}
      </button>
    </form>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <!-- Test için örnek kullanıcı bilgileri -->
    <div class="test-info">
      <small class="text-muted">
        <strong>Test için:</strong><br>
        E-posta: rafasilva&#64;gmail.com<br>
        Şifre: Deneme123.
      </small>
    </div>
  </div>
</div>
