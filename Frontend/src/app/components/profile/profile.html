<!-- src/app/components/profile/profile.html -->
<div class="profile-page">
  <!-- Language Selector (Top Center) -->
  <div class="language-selector">
    <select [(ngModel)]="selectedLang" (change)="onLangChange($event)" class="lang-select">
      <option value="tr">🇹🇷 Türkçe</option>
      <option value="en">🇺🇸 English</option>
      <option value="de">🇩🇪 Deutsch</option>
    </select>
  </div>

  <!-- QR Code Button (Top Left) -->
  <div class="qr-fab">
    <div class="qr-icon" (click)="showQr = !showQr">
      <img src="https://cdn-icons-png.flaticon.com/512/2313/2313147.png" alt="QR Kod" width="24" height="24" />
    </div>
    
    <!-- QR Code Display (Top Left) -->
    <div class="qr-display" *ngIf="showQr">
      <qrcode [qrdata]="profileUrl" [width]="150" [errorCorrectionLevel]="'M'"></qrcode>
    </div>
  </div>

  <!-- Settings Button (Top Right) -->
  <div class="settings-fab" [class.active]="showSettings" (click)="toggleSettings()">
    <div class="settings-icon">⚙️</div>
    
    <!-- Settings Menu - Link Editor Controls (Always exists, but hidden/shown) -->
    <div class="settings-menu" [style.display]="showSettings ? 'block' : 'none'" (click)="$event.stopPropagation()">
      <app-link-editor [userId]="userId" (linksChanged)="onLinksChanged()"></app-link-editor>
      
      <!-- Logout Button -->
      <div class="settings-actions">
        <button class="logout-btn" (click)="logout()">
          🚪 Çıkış Yap
        </button>
      </div>
    </div>
  </div>

  <!-- Share Button (Bottom Right) -->
  <div class="share-fab">
    <div class="share-icon" (click)="shareProfile()">
      📤
    </div>
  </div>

  <!-- Profile Card -->
  <div class="profile-card">
    <!-- Profile Avatar & Basic Info -->
    <div class="profile-header">
      <div class="avatar-section">
        <img [src]="profile?.profilePhotoUrl ? (imageBaseUrl + profile?.profilePhotoUrl) : (imageBaseUrl + '/profile-photos/default.png')"
             alt="Profil Fotoğrafı"
             class="profile-avatar" />
        
        <!-- Photo Edit Button (Always visible) -->
        <button class="photo-edit-btn" (click)="togglePhotoActions()">
          ✏️
        </button>
        
        <!-- Photo Actions (Show when photo edit is active) -->
        <div class="photo-actions" *ngIf="showPhotoActions">
          <button class="photo-btn" (click)="fileInput.click()">📷 Ekle</button>
          <button class="photo-btn delete" (click)="onDeletePhoto()" [disabled]="!profile?.profilePhotoUrl">🗑️ Sil</button>
          <input #fileInput type="file" (change)="onPhotoSelected($event)" accept="image/*" style="display:none" />
        </div>
      </div>

      <div class="profile-info" *ngIf="user">
        <h1 class="profile-name">{{ user.fullName }}</h1>
        <p class="profile-title">{{ user.jobTitle }}</p>
        <p class="profile-company">{{ user.company }}</p>
      </div>
    </div>

    <!-- Contact Info -->
    <div class="contact-section">
      <div class="contact-item" *ngIf="user?.email">
        <span class="contact-icon">📧</span>
        <a [href]="'mailto:' + user?.email" class="contact-link">{{ user?.email }}</a>
      </div>
      <div class="contact-item" *ngIf="user?.phoneNumber">
        <span class="contact-icon">📞</span>
        <a [href]="'tel:' + user?.phoneNumber" class="contact-link">{{ user?.phoneNumber }}</a>
      </div>
    </div>

    <!-- Dynamic Links -->
    <div class="links-section" *ngIf="profile?.links?.length">
      <h3 class="section-title">Bağlantılar</h3>
      <div class="links-grid">
        <div *ngFor="let link of filteredLinks" class="link-card">
          <span class="link-icon">{{ getLinkIcon(link.definitionName) }}</span>
          <div class="link-content">
            <span class="link-label">{{ link.definitionName }}</span>
            <div class="link-value">
              <ng-container [ngSwitch]="true">
                <a *ngSwitchCase="link.value?.startsWith('mailto:')" 
                   [href]="link.value" class="link-anchor">{{ link.value.substring(7) }}</a>
                <a *ngSwitchCase="link.value?.startsWith('tel:')" 
                   [href]="link.value" class="link-anchor">{{ link.value.substring(4) }}</a>
                <a *ngSwitchCase="link.value?.startsWith('http')" 
                   [href]="link.value" target="_blank" rel="noopener noreferrer" class="link-anchor">{{ link.value }}</a>
                <span *ngSwitchDefault class="link-text">{{ link.value }}</span>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Cropper Dialog -->
  <app-cropper-dialog 
    *ngIf="showCropper && cropperData"
    [data]="cropperData"
    [onResult]="onCropperResult.bind(this)">
  </app-cropper-dialog>
</div>
