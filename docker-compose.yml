services:
  db:
    image: postgres:17-alpine # Rolling tag chosen intentionally (rolling for CVE patches)
    container_name: diji_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sifre
      POSTGRES_DB: import_db
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - diji-net
    volumes:
      # DB data (persistent). Silip yeniden kurmak için: docker compose down -v
      - pgdata:/var/lib/postgresql/data
      # Init script + dump (ilk kez boş data directory oluşurken restore eder)
      - ./db-init/01-restore.sh:/docker-entrypoint-initdb.d/01-restore.sh:ro
      - ./backup.dump:/docker-entrypoint-initdb.d/backup.dump:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diji_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Reverted to original imported database name 'import_db' so existing data is visible again
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=import_db;Username=postgres;Password=sifre"
      Jwt__Key: dev-secret-key-change-me-32chars-min
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5078:5078"
    networks:
      - diji-net
    volumes:
      - profile_photos:/app/wwwroot/profile-photos
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://localhost:5078/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    container_name: diji_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - diji-net

  pgadmin:
    image: dpage/pgadmin4:8.11
    container_name: diji_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    depends_on:
      - db
    ports:
      - "5050:80" # Access pgAdmin at http://localhost:5050
    networks:
      - diji-net
    volumes:
      - pgadmin_data:/var/lib/pgadmin

networks:
  diji-net:
    driver: bridge

volumes:
  pgdata:
  profile_photos:
  dataprotection_keys:
  pgadmin_data:
